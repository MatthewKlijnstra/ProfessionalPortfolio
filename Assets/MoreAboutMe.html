<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More About Me | Matthew Klijnstra</title>
    <link rel="stylesheet" href="CSS/Global.CSS">
    <link rel="stylesheet" href="CSS/MoreAboutMe.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Minimal Nav/Back Button -->
    <nav id="back-nav" class="glass-panel">
        <a href="../index.html#about" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back
        </a>
    </nav>

    <main class="hex-container section">

        <!-- Left Column: Details & Images -->
        <section class="details-panel glass-panel">
            <h1 id="interest-title" class="text-gradient">Select an Interest</h1>
            <p id="interest-desc" class="interest-description">
                Click on any of the hexablocks on the right to learn more about my specific interests, hobbies, and the
                technology I work with.
            </p>

            <!-- Dynamic Image Carousel -->
            <div id="image-carousel" class="carousel-container hidden">
                <div class="carousel-track" id="carousel-track">
                    <!-- Images injected securely via JS -->
                </div>

                <!-- Carousel Controls -->
                <button class="carousel-btn prev-btn" id="btn-prev" aria-label="Previous image">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button class="carousel-btn next-btn" id="btn-next" aria-label="Next image">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>

                <!-- Indicators -->
                <div class="carousel-indicators" id="carousel-indicators">
                    <!-- Dots injected via JS -->
                </div>
            </div>
        </section>

        <!-- Right Column: Hexablock Grid -->
        <section class="hex-grid-wrapper">
            <div class="hex-grid">

                <!-- Hexagon 1: Selfdefense -->
                <div class="hexagon hex-interactive" data-interest="selfdefense">
                    <div class="hex-content">
                        <!-- Karate Gi Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#44ab55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                            <path d="M12 22V2" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 2: Cycling -->
                <div class="hexagon hex-interactive" data-interest="cycling">
                    <div class="hex-content">
                        <!-- Bike Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#2942bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-bike-icon lucide-bike">
                            <circle cx="18.5" cy="17.5" r="3.5" />
                            <circle cx="5.5" cy="17.5" r="3.5" />
                            <circle cx="15" cy="5" r="1" />
                            <path d="M12 17.5V14l-3-3 4-3 2 3h2" />
                        </svg>
                    </div>
                </div>



                <!-- Hexagon center decoration (non-interactive) -->
                <div class="hexagon hex-decorative">
                    <!-- Blank center or subtle glow -->
                </div>

            </div>
        </section>

    </main>

    <script src="JS/MoreAboutMe.JS" defer></script>
</body>

</html>
