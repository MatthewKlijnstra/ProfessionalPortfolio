<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More About Me | Matthew Klijnstra</title>
    <link rel="stylesheet" href="CSS/Global.CSS">
    <link rel="stylesheet" href="CSS/MoreAboutMe.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Minimal Nav/Back Button -->
    <nav id="back-nav" class="glass-panel">
        <a href="../index.html#about" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back
        </a>
    </nav>

    <main class="hex-container section">

        <!-- Left Column: Details & Images -->
        <section class="details-panel glass-panel">
            <h1 id="interest-title" class="text-gradient">Select an Interest</h1>
            <p id="interest-desc" class="interest-description">
                Click on any of the hexablocks on the right to learn more about my specific interests, hobbies, and the
                technology I work with.
            </p>

            <!-- Dynamic Image Carousel -->
            <div id="image-carousel" class="carousel-container hidden">
                <div class="carousel-track" id="carousel-track">
                    <!-- Images injected securely via JS -->
                </div>

                <!-- Carousel Controls -->
                <button class="carousel-btn prev-btn" id="btn-prev" aria-label="Previous image">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button class="carousel-btn next-btn" id="btn-next" aria-label="Next image">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>

                <!-- Indicators -->
                <div class="carousel-indicators" id="carousel-indicators">
                    <!-- Dots injected via JS -->
                </div>
            </div>
        </section>

        <!-- Right Column: Hexablock Grid -->
        <section class="hex-grid-wrapper">
            <div class="hex-grid">

                <!-- Hexagon 1: Selfdefense -->
                <div class="hexagon hex-interactive" data-interest="selfdefense">
                    <div class="hex-content">
                        <!-- Karate Gi Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#44ab55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                            <path d="M12 22V2" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 2: Cycling -->
                <div class="hexagon hex-interactive" data-interest="cycling">
                    <div class="hex-content">
                        <!-- Bike Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#2942bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-bike-icon lucide-bike">
                            <circle cx="18.5" cy="17.5" r="3.5" />
                            <circle cx="5.5" cy="17.5" r="3.5" />
                            <circle cx="15" cy="5" r="1" />
                            <path d="M12 17.5V14l-3-3 4-3 2 3h2" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 3: Star gazing -->
                <div class="hexagon hex-interactive" data-interest="stargazing">
                    <div class="hex-content">
                        <!-- telescope Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#401376" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-telescope-icon lucide-telescope">
                            <path
                                d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44" />
                            <path d="m13.56 11.747 4.332-.924" />
                            <path d="m16 21-3.105-6.21" />
                            <path
                                d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z" />
                            <path d="m6.158 8.633 1.114 4.456" />
                            <path d="m8 21 3.105-6.21" />
                            <circle cx="12" cy="13" r="2" />
                        </svg>
                    </div>
                </div>



                <!-- Hexagon center decoration (non-interactive) -->
                <div class="hexagon hex-decorative">
                    <!-- Blank center or subtle glow -->
                </div>

                <!-- Hexagon center decoration (non-interactive) -->
                <div class="hexagon hex-decorative">
                    <!-- Blank center or subtle glow -->
                </div>

                <!-- Hexagon 4: Pet -->
                <div class="hexagon hex-interactive" data-interest="pet">
                    <div class="hex-content">
                        <!-- Walking icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#d93030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-dog-icon lucide-dog">
                            <path d="M11.25 16.25h1.5L12 17z" />
                            <path d="M16 14v.5" />
                            <path
                                d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309" />
                            <path d="M8 14v.5" />
                            <path
                                d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 5: Shooting range -->
                <div class="hexagon hex-interactive" data-interest="shootingsports">
                    <div class="hex-content">
                        <!-- Shooting range icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#a58922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-bow-arrow-icon lucide-bow-arrow">
                            <path d="M17 3h4v4" />
                            <path d="M18.575 11.082a13 13 0 0 1 1.048 9.027 1.17 1.17 0 0 1-1.914.597L14 17" />
                            <path d="M7 10 3.29 6.29a1.17 1.17 0 0 1 .6-1.91 13 13 0 0 1 9.03 1.05" />
                            <path
                                d="M7 14a1.7 1.7 0 0 0-1.207.5l-2.646 2.646A.5.5 0 0 0 3.5 18H5a1 1 0 0 1 1 1v1.5a.5.5 0 0 0 .854.354L9.5 18.207A1.7 1.7 0 0 0 10 17v-2a1 1 0 0 0-1-1z" />
                            <path d="M9.707 14.293 21 3" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 6: Army -->
                <div class="hexagon hex-interactive" data-interest="army">
                    <div class="hex-content">
                        <!-- Army icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#075606" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-swords-icon lucide-swords">
                            <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
                            <line x1="13" x2="19" y1="19" y2="13" />
                            <line x1="16" x2="20" y1="16" y2="20" />
                            <line x1="19" x2="21" y1="21" y2="19" />
                            <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" />
                            <line x1="5" x2="9" y1="14" y2="18" />
                            <line x1="7" x2="4" y1="17" y2="20" />
                            <line x1="3" x2="5" y1="19" y2="21" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon center decoration (non-interactive) -->
                <div class="hexagon hex-decorative">
                    <!-- Blank center or subtle glow -->
                </div>

                <!-- Hexagon center decoration (non-interactive) -->
                <div class="hexagon hex-decorative">
                    <!-- Blank center or subtle glow -->
                </div>

                <!-- Hexagon 7: Console Gaming -->
                <div class="hexagon hex-interactive" data-interest="consolegaming">
                    <div class="hex-content">
                        <!-- Console Gaming icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#a51850" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-gamepad2-icon lucide-gamepad-2">
                            <line x1="6" x2="10" y1="11" y2="11" />
                            <line x1="8" x2="8" y1="9" y2="13" />
                            <line x1="15" x2="15.01" y1="12" y2="12" />
                            <line x1="18" x2="18.01" y1="10" y2="10" />
                            <path
                                d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 8: PC Gaming -->
                <div class="hexagon hex-interactive" data-interest="pcgaming">
                    <div class="hex-content">
                        <!-- PC Gaming icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#5b676b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-computer-icon lucide-computer">
                            <rect width="14" height="8" x="5" y="2" rx="2" />
                            <rect width="20" height="8" x="2" y="14" rx="2" />
                            <path d="M6 18h2" />
                            <path d="M12 18h6" />
                        </svg>
                    </div>
                </div>

                <!-- Hexagon 9: VR Gaming -->
                <div class="hexagon hex-interactive" data-interest="vrgaming">
                    <div class="hex-content">
                        <!-- VR Gaming icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#0e90e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-rectangle-goggles-icon lucide-rectangle-goggles">
                            <path
                                d="M20 6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4a2 2 0 0 1-1.6-.8l-1.6-2.13a1 1 0 0 0-1.6 0L9.6 17.2A2 2 0 0 1 8 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
                        </svg>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script src="JS/MoreAboutMe.JS" defer></script>

</html>
