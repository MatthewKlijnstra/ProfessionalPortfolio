<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link rel="stylesheet" href="CSS/Global.CSS">
    <link rel="stylesheet" href="CSS/Projects.CSS">
    <link rel="stylesheet" href="CSS/SubPage.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Include marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- Minimal Nav/Back Button -->
    <nav id="back-nav" class="glass-panel">
        <a href="../index.html#projects" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back
        </a>
    </nav>

    <!-- Hero Section -->
    <header class="project-hero">
        <div class="hero-image-container">
            <img id="dyn-hero-img" src="" alt="Hero Background" class="hero-bg-img">
        </div>
        <div class="hero-overlay glass-panel">
            <h1 id="dyn-title" class="project-title text-gradient">Loading...</h1>
            <p id="dyn-tagline" class="project-tagline"></p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="project-details" class="section">
        <div class="project-grid" id="project-details-container">
            <!-- Left Column: Details & Media -->
            <div class="project-info">
                
                <!-- Dynamic Content (About, Features, etc.) -->
                <div id="dyn-main-content"></div>

                <!-- Gallery -->
                <section id="dyn-gallery-section" class="info-section gallery-section" style="display: none;">
                    <h2 class="section-subtitle">Gallery</h2>
                    <div id="dyn-gallery-container" class="media-gallery">
                        <!-- Dynamic Images -->
                    </div>
                </section>
            </div>

            <!-- Right Column: Metadata Panel -->
            <aside class="project-sidebar">
                <div class="metadata-panel glass-panel">
                    <h3 class="panel-title">Project Info</h3>

                    <div class="meta-item">
                        <span class="meta-label">Role:</span>
                        <span id="dyn-role" class="meta-value">...</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Timeline:</span>
                        <span id="dyn-timeline" class="meta-value">...</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Platform:</span>
                        <span id="dyn-platform" class="meta-value">...</span>
                    </div>

                    <div class="meta-tags">
                        <h4 class="meta-subtitle">Tech Stack</h4>
                        <div id="dyn-tags-container" class="card-tags">
                            <!-- Dynamic Tags -->
                        </div>
                    </div>

                    <div class="project-actions">
                        <a href="#" class="cta-button" id="btn-view-source" style="display: none;">View Source Code</a>
                        <a href="#" id="dyn-download-btn" class="cta-button secondary-btn" style="display: none;">Download
                            Demo</a>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Source Code Side Panel -->
    <div id="source-panel" class="side-panel glass-panel">
        <div class="panel-header">
            <button id="btn-close-source" class="close-btn" aria-label="Close panel">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <a href="#" id="dyn-github-link" class="github-btn" target="_blank"
                rel="noopener noreferrer" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                </svg>
                GitHub
            </a>
        </div>
        <div id="dyn-source-content" class="panel-content">
            <!-- Dynamic Source Features -->
        </div>
    </div>

    <script src="JS/Global.JS" defer></script>
    <script src="JS/SubPage.JS" defer></script>
</body>

</html>
